name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches Cargo.toml
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version v$version"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal -c clippy -c rustfmt
          rustup default stable
      - uses: Swatinem/rust-cache@v2

      - name: Format, lint and test
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $name = "procwatch-v$env:VERSION-windows-x64"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/release/procwatch.exe, README.md, LICENSE, CHANGELOG.md, config.example.toml $name
          Copy-Item docs $name -Recurse
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Extract release notes
        shell: pwsh
        run: |
          $text = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)"
          $match = [regex]::Match($text, $pattern)
          if (-not $match.Success) { throw "No CHANGELOG section for $env:VERSION" }
          $match.Groups[1].Value.Trim() | Out-File -FilePath notes.md -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME $env:ASSET --title "procwatch $env:GITHUB_REF_NAME" --notes-file notes.md
